<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MY MONEY</title>
  <meta name="description" content="개인 가계부 · 자산관리 앱">
  <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MY MONEY">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar" aria-label="메인 메뉴">
      <button class="tab" data-tab="home" aria-label="홈">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>HOME</span>
      </button>
      <button class="tab" data-tab="history" aria-label="거래내역">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>HISTORY</span>
      </button>
      <button class="tab tab-add" id="addBtn" aria-label="거래 추가">
        <span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      </button>
      <button class="tab" data-tab="assets" aria-label="자산">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 14.5h2"/></svg>
        <span>ASSETS</span>
      </button>
      <button class="tab" data-tab="goals" aria-label="목표">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" class="fill"/></svg>
        <span>GOALS</span>
      </button>
    </nav>

    <div id="sheetRoot"></div>
    <div id="toast" class="toast" role="status"></div>
    <div id="updateBar" class="update-bar" hidden>
      <span>새 버전이 준비되었습니다.</span>
      <button id="updateBtn" class="btn-sm">업데이트</button>
    </div>
  </div>

  <noscript>MY MONEY를 사용하려면 JavaScript를 켜 주세요.</noscript>
  <script src="app.js"></script>
</body>
</html>
